<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>exemplos</title>
    <style>
        body { 
            font-family: Arial, Helvetica, sans-serif;

        }

        div:hover {
            color: rgb(247, 0, 0);
        }

        div > p {
            display: none;
        }

        div:hover > p {

            display: block;
            color: blue;
            background-color: aqua;
            width: 300px;
        }
    </style>
</head>
<body>
    <h1>Exemplo de Hover</h1>
    <p>Passe o mouse por cima do texto abaixo</p>
    <div>
        Passe o mouse aqui
    <p>TEXTO ESCONDIDO...</p>
    </div>
    <p>fim do evento</p>
</body>
</html>
