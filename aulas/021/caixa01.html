<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>caixas</title>
    <style>
       h1 {
        background-color: blue;
        height: 300px;
        width: 300px;
        border-width: 10px;
        border-style: solid;
        border-color: blueviolet;

        border: 10px solid blueviolet;

        padding-top: 10px;
        padding-right: 10px;
        padding-bottom: 10px;
        padding-left: 10px;

        padding: 10px 10px 10px 10px;

        margin-top: 20px;
        margin-right: 20px;
        margin-bottom: 20px;
        margin-left: 40px;
       }

       a {
        border-color: rgb(211, 12, 151);
        border-width: 10px;
        border-style: solid;
        padding-top: 10px;
        padding-right: 10px;
        padding-bottom: 10px;
        padding-left: 10px;
       }
    </style>
</head>
<body>
    <h1>Exemplo de caixa box-level</h1>
    <p> paragrafos tambem são exemplos de caixas box Box-level, <a href="">mas os links são exemplos de caixas inline-level</a>, vamos ver como tudo isso funciona</p>
</body>
</html>
